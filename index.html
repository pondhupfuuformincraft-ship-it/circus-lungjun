<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circus Lungjun by OneTwo Gang</title><style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f5;font-family:system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:22px 14px}header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}small{letter-spacing:4px;color:#8e96a7}h1{font-size:clamp(30px,7vw,58px);margin:5px 0;font-weight:900}header p{color:#8e96a7;margin:0}.status{border:1px solid #303440;border-radius:99px;padding:8px 12px;color:#9ff0c8;font-size:12px}.hero,.card{background:#12141b;border:1px solid #292d38;border-radius:20px;padding:18px;margin-bottom:18px}.hero{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.hero label{display:flex;flex-direction:column;gap:7px;color:#8e96a7;font-size:11px}.hero input{font:inherit;color:#fff;background:#090a0e;border:1px solid #333;padding:10px;border-radius:9px}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}button.dark{background:#292d38;color:#fff;margin-left:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px;border-bottom:1px solid #272a33}th{font-size:10px;color:#8e96a7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}footer{text-align:center;color:#687083;padding:20px;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}header{align-items:flex-start}.hero button{width:100%}}</style></head>
<body><main><header><div><small>ONE TWO GANG</small><h1>🎪 CIRCUS LUNGJUN</h1><p>Realtime Scoreboard</p></div><div class="status">READY</div></header>
<section class="hero"><label>SEASON<input id="season" value="Season 1"></label><label>GAME<input id="game" type="number" value="1" min="1" style="width:80px"></label><button onclick="nextGame()">NEXT GAME</button></section>
<section class="card"><h2>🏆 LIVE RANKING</h2><div class="tablewrap"><table><thead><tr><th>#</th><th>PLAYER</th><th>SCORE</th><th>WIN</th><th>DIFF</th><th>💀</th><th>🚫 BAN</th><th>EDIT</th></tr></thead><tbody id="ranking"></tbody></table></div></section>
<section class="grid"><div class="card"><h3>🎮 GAME CONTROL</h3><button onclick="nextGame()">NEXT GAME</button><button class="dark" onclick="prevGame()">PREVIOUS</button></div><div class="card"><h3>📋 STATUS</h3><p>Season: <b id="s2">Season 1</b></p><p>Current game: <b id="g2">1</b></p><p>Mode: <b>OTF / League</b></p></div></section><footer>Circus Lungjun by OneTwo Gang</footer></main>
<script>
const players=[1,2,3,4].map(i=>({name:"Player "+i,score:0,wins:0,difference:0,skull:0,ban_games:0}));
function render(){players.sort((a,b)=>b.score-a.score||b.wins-a.wins);ranking.innerHTML=players.map((p,i)=>'<tr><td>'+(i+1)+'</td><td><strong>'+p.name+'</strong></td><td>'+p.score+'</td><td>'+p.wins+'</td><td>'+p.difference+'</td><td>'+p.skull+'</td><td>'+p.ban_games+'</td><td><button onclick="pScore('+i+')">+1</button><button class="dark" onclick="pWin('+i+')">WIN</button></td></tr>').join('');s2.textContent=season.value;g2.textContent=game.value}
function pScore(i){players[i].score++;render()}function pWin(i){players[i].wins++;players[i].score++;render()}function nextGame(){game.value=+game.value+1;render()}function prevGame(){game.value=Math.max(1,+game.value-1);render()}season.oninput=render;game.oninput=render;render();
</script></body></html>
